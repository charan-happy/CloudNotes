spring.application.name=user-service
server.port=8002

# ── Datasource (cloud-agnostic: any PostgreSQL via env) ─────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudnotes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cloudnotes}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cloudnotes}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool (tuned for scale) ──────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=60000

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# Schema is owned by scripts/init.sql; validate that entities match, never auto-mutate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Actuator / Prometheus ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=user-service

# ── Graceful shutdown (k8s SIGTERM drains in-flight requests) ───────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ── Structured JSON logging (Spring Boot 3.4+ native) ───────────────────────
# ECS = Elastic Common Schema — ideal for ELK. Override with LOG_FORMAT for
# local plain logs (set LOG_FORMAT= to disable). One JSON object per line.
logging.structured.format.console=${LOG_FORMAT:ecs}
